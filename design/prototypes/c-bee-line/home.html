<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e0c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2eee3" media="(prefers-color-scheme: light)" />
  <title>Spelling Bee | Hear it. Spell it. Fast.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stripes" aria-hidden="true"></div>
  <div class="page">
    <header class="topbar">
      <span class="brand"><i data-mark></i><span class="sr-only">Spelling Bee</span></span>
      <button class="icon-btn" aria-label="Settings"><i data-icon="settings"></i></button>
    </header>

    <main class="home">
      <h1 tabindex="-1">Spelling<br />Bee</h1>
      <i data-flight></i>
      <p class="lede">You hear a word. You spell it. The clock doesn't wait.</p>
      <div class="choices">
        <button class="choice primary"><span><b>Play solo</b><span>Eight levels, ten words</span></span><i data-icon="arrow-left"></i></button>
        <button class="choice"><span><b>Race friends</b><span>Share a code, spell at once, or take turns</span></span><i data-icon="arrow-left"></i></button>
      </div>
    </main>
  </div>
  <script src="../_shared/icons.js"></script>
  <script src="art.js"></script>
</body>
</html>
