<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spelling Bee | Race results</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stripes" aria-hidden="true"></div>
  <div class="page">
    <header class="topbar">
      <span class="brand"><i data-mark></i><span>Spelling Bee</span></span>
      <button class="icon-btn" aria-label="Settings"><i data-icon="settings"></i></button>
    </header>

    <main class="results">
      <h1 tabindex="-1">Tomasz wins</h1>
      <p class="lede">By 3 points. You came 2nd on Medium words.</p>

      <ol class="lanes" aria-label="Final standings">
        <li class="lane first"><span class="pos num">1</span><span class="name"><b>Tomasz</b><span>8 of 10 spelled</span></span><span class="track"><span class="token" style="left: calc(100% - 38px)"><i data-avatar="clover"></i></span></span><span class="pts num">208</span></li>
        <li class="lane you"><span class="pos num">2</span><span class="name"><b>Maya</b><span>8 of 10 spelled</span></span><span class="track"><span class="token" style="left: calc(98% - 38px)"><i data-avatar="bee"></i></span></span><span class="pts num">205</span></li>
        <li class="lane"><span class="pos num">3</span><span class="name"><b>Adaeze</b><span>6 of 10 spelled</span></span><span class="track"><span class="token" style="left: 66%"><i data-avatar="blossom"></i></span></span><span class="pts num">141</span></li>
        <li class="lane"><span class="pos num">4</span><span class="name"><b>Rafael</b><span>3 of 10 spelled</span></span><span class="track"><span class="token" style="left: 30%"><i data-avatar="wasp"></i></span></span><span class="pts num">67</span></li>
      </ol>

      <div class="actions"><button class="btn">Back to lobby</button></div>
    </main>
  </div>
  <script src="../_shared/icons.js"></script>
  <script src="../_shared/avatars.js"></script>
  <script src="art.js"></script>
</body>
</html>
