<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spelling Bee | Race results</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <span class="brand"><i data-mark></i>Spelling Bee</span>
      <button class="icon-btn" aria-label="Settings"><i data-icon="settings"></i></button>
    </header>

    <main class="results">
      <span class="label">Race finished, Medium words</span>
      <h1 tabindex="-1">Tomasz takes it by 3 points</h1>
      <p class="lede">You finished 2nd, with 8 of 10 words spelled.</p>

      <ol class="bed" aria-label="Final standings">
        <li class="first"><span class="rank num">1</span><div class="row"><span class="roundel"><i data-avatar="clover"></i></span><span class="who"><b>Tomasz</b><span class="growth" style="width:100%"></span></span><span class="pts num">208</span></div></li>
        <li class="you"><span class="rank num">2</span><div class="row"><span class="roundel"><i data-avatar="bee"></i></span><span class="who"><b>Maya</b><span class="growth" style="width:98%"></span></span><span class="pts num">205</span></div></li>
        <li><span class="rank num">3</span><div class="row"><span class="roundel"><i data-avatar="blossom"></i></span><span class="who"><b>Adaeze</b><span class="growth" style="width:68%"></span></span><span class="pts num">141</span></div></li>
        <li><span class="rank num">4</span><div class="row"><span class="roundel"><i data-avatar="wasp"></i></span><span class="who"><b>Rafael</b><span class="growth" style="width:32%"></span></span><span class="pts num">67</span></div></li>
      </ol>

      <div class="actions"><button class="btn btn-primary">Back to lobby</button></div>
    </main>
  </div>
  <script src="../_shared/icons.js"></script>
  <script src="../_shared/avatars.js"></script>
  <script src="art.js"></script>
</body>
</html>
