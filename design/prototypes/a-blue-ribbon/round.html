<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spelling Bee | Medium, word 4 of 10</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <button class="link-back"><i data-icon="arrow-left"></i>Quit</button>
      <button class="icon-btn" aria-label="Settings"><i data-icon="settings"></i></button>
    </header>

    <main class="round">
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

      <div class="round-head">
        <span class="tier-name" style="color: var(--muted)">Medium</span>
        <div class="placard"><b class="num">4</b><span>of 10 words</span></div>
        <div class="clock num" aria-label="9 seconds left">9<small>s</small></div>
      </div>

      <section class="pronouncer" aria-labelledby="word-h">
        <p class="who" id="word-h"><i data-icon="mic"></i>Your word is…</p>
        <p class="definition">“A strong, regular repeated pattern of sound”</p>
        <button class="chip-btn"><i data-icon="volume-2"></i>Hear it again</button>
      </section>

      <form class="answer" onsubmit="return false">
        <label for="guess">Spell it</label>
        <div class="answer-field focus" id="guess" role="textbox" aria-label="Spell it">rhyt<span class="caret"></span></div>
        <div class="timer" aria-hidden="true"><i></i></div>
      </form>

      <div class="round-foot">
        <div class="tally">
          <span><b class="num">58</b>points</span>
          <span><b class="num">3</b>in a row</span>
        </div>
        <button class="text-btn">Skip this word</button>
      </div>
    </main>
  </div>
  <script src="../_shared/icons.js"></script>
</body>
</html>
