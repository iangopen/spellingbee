name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time. A deploy that has started is allowed to finish,
# never cancelled halfway; a newer push waits (GitHub keeps only the newest
# waiting run), so an older commit can't deploy after a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, not ubuntu-latest, so a new default image can't change the deploy
    # by surprise. Bumping it is a deliberate step (see CLAUDE.md, Deploy).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # npm ci installs exactly package-lock.json, so CI builds what is tested.
      - run: npm ci
      # Vite inlines VITE_* at build time, so these must be present HERE, not at
      # runtime. Without them the app builds fine but multiplayer is disabled in
      # the deployed bundle. The anon key is a publishable client key (it ships
      # to every browser by design and is protected by RLS) — it lives in Actions
      # secrets so it stays out of the repo, not because the bundle hides it.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional Cloudflare Turnstile site key (public by design). While the
          # secret is unset the build has no CAPTCHA widget, exactly as before.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
